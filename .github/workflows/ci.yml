
name: EventGo CI

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. UNIT TESTS
  # ==========================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # ==========================================
  # 2. READ-ONLY INTEGRATION TESTS
  # ==========================================

  integration-tests:
    name: Read-Only Integration Tests
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing"
            exit 1
          fi

      - name: Run selected Integration Tests
        run: |
          npx vitest run --project integration \
            --testTimeout=30000 \
            --hookTimeout=30000 \
            --maxWorkers=1 \
            eventgo-backend/tests/integration/auth.integration.test.ts \
            eventgo-backend/tests/integration/event.service.integration.test.ts \
            eventgo-backend/tests/integration/ticket-type.service.integration.test.ts \
            eventgo-backend/tests/integration/analytics.service.integration.test.ts \
            eventgo-backend/tests/integration/dashboard.service.integration.test.ts

  # ==========================================
  # 3. FRONTEND BUILD
  # ==========================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Event App
        run: npm run build --workspace=event-app

      - name: Build Auth App
        shell: bash
        run: |
          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
          npm run build --workspace=eventgo-auth

      - name: Build Admin App
        run: npm run build --workspace=eventgo-admin

  # ==========================================
  # 4. PLAYWRIGHT E2E TESTS
  # ==========================================

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Do not expose production secrets to PR code.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        shell: bash
        run: |
          for var in DATABASE_URL JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is missing"
              exit 1
            fi
          done

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start EventGo applications
        shell: bash
        run: |
          nohup npm run dev > /tmp/eventgo-dev.log 2>&1 &
          echo $! > /tmp/eventgo-dev.pid

      - name: Wait for EventGo
        shell: bash
        run: |
          for i in {1..120}; do
            if curl --silent --output /dev/null http://localhost:3000/auth/login; then
              echo "EventGo proxy is responding"
              exit 0
            fi
            sleep 2
          done

          echo "::error::EventGo did not start"
          tail -100 /tmp/eventgo-dev.log
          exit 1

      - name: Run Playwright E2E
        run: |
          npx playwright test tests/e2e/eventgo.spec.ts \
            --project=chromium \
            --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show application logs on failure
        if: failure()
        run: |
          if [ -f /tmp/eventgo-dev.log ]; then
            tail -150 /tmp/eventgo-dev.log
          fi
