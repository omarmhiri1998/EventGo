
name: EventGo CI

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. UNIT TESTS
  # ==========================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # ==========================================
  # 2. READ-ONLY INTEGRATION TESTS
  # ==========================================

  integration-tests:
    name: Read-Only Integration Tests
    runs-on: ubuntu-latest

    # Do not expose database secrets
    # to pull request code.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing"
            exit 1
          fi

      - name: Run selected Integration Tests
        run: |
          npx vitest run --project integration \
            --testTimeout=30000 \
            --hookTimeout=30000 \
            --maxWorkers=1 \
            eventgo-backend/tests/integration/auth.integration.test.ts \
            eventgo-backend/tests/integration/event.service.integration.test.ts \
            eventgo-backend/tests/integration/ticket-type.service.integration.test.ts \
            eventgo-backend/tests/integration/analytics.service.integration.test.ts \
            eventgo-backend/tests/integration/dashboard.service.integration.test.ts

  # ==========================================
  # 3. FRONTEND BUILD
  # ==========================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ======================================
      # BUILD EVENT APP
      # ======================================

      - name: Build Event App
        run: npm run build --workspace=event-app

      # ======================================
      # BUILD AUTH APP
      # ======================================

      - name: Build Auth App
        shell: bash
        run: |
          # Generate independent temporary keys.
          # Used only during this CI build.

          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 32)"

          npm run build --workspace=eventgo-auth

      # ======================================
      # BUILD ADMIN APP
      # ======================================

      - name: Build Admin App
        run: npm run build --workspace=eventgo-admin
